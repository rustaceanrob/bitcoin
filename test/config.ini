# These environment variables are set by the build process and read by
# test/*/test_runner.py

[environment]
CLIENT_NAME=Bitcoin Core
CLIENT_BUGREPORT=https://github.com/bitcoin/bitcoin/issues
SRCDIR=/home/rob/bitcoin-core/review
BUILDDIR=/home/rob/bitcoin-core/review/build
EXEEXT=
RPCAUTH=/home/rob/bitcoin-core/review/share/rpcauth/rpcauth.py

[components]
# Which components are enabled.
ENABLE_WALLET=true
BUILD_BENCH=false
ENABLE_CLI=true
BUILD_BITCOIN_TX=true
ENABLE_BITCOIN_UTIL=true
ENABLE_BITCOIN_CHAINSTATE=false
ENABLE_WALLET_TOOL=true
ENABLE_BITCOIND=true
ENABLE_FUZZ_BINARY=false
ENABLE_ZMQ=false
ENABLE_EMBEDDED_ASMAP=true
ENABLE_EXTERNAL_SIGNER=true
ENABLE_USDT_TRACEPOINTS=false
ENABLE_IPC=true
BUILD_GUI=false
